name: CI

# Minimal safety net (docs/plan/phase-9-production-hardening.md T7): compile the backend
# and run its DB-less unit tests, typecheck+test both sidecars (T4) and guard their synced
# protocol files (T5), and typecheck+test+build the frontend (T6). No Postgres service here
# on purpose — ApplicationTests and every *DbTest (T3, @SpringBootTest, need a live DB) are
# tagged "integration" and stay out of this run; they're still the manual-test-script's job
# locally, where Postgres is already required. Everything after this workflow lands on
# green CI.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (compile + DB-less unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Skips the frontend-maven-plugin's npm install/build (irrelevant to a backend
      # compile+test check, and slow) — same flags CLAUDE.md documents for a fast local
      # build. -DexcludedGroups=integration drops ApplicationTests (needs live Postgres).
      - name: Compile and run unit tests
        run: ./mvnw -B -Dskip.installnodenpm -Dskip.npm -DexcludedGroups=integration test

  sidecars:
    name: Sidecars (typecheck + test + protocol-sync guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Pure Node, no deps — runs before the (slower) npm installs so a real drift fails fast.
      - name: Check sidecar/sidecar-codex protocol files are in sync
        run: node scripts/check-protocol-sync.mjs
      - name: Test and typecheck sidecar
        working-directory: sidecar
        run: |
          npm ci
          npm test
          npm run build
      - name: Test and typecheck sidecar-codex
        working-directory: sidecar-codex
        run: |
          npm ci
          npm test
          npm run build
      # capabilities.json is committed (the backend's ProviderCatalog reads it without
      # needing Node) but build-generated from each package's *_CAPABILITIES const (see
      # docs/plan/phase-10-review-followups.md R1) — the build steps above just
      # regenerated both files in place, so a leftover diff means a committed copy is
      # stale (protocol.ts changed without re-running `npm run build`/committing the
      # result).
      - name: Check capabilities.json is up to date
        run: git diff --exit-code -- sidecar/capabilities.json sidecar-codex/capabilities.json

  frontend:
    name: Frontend (typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
          npm run build:demo
      - run: node scripts/capture-demo.mjs --check
